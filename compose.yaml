name: cheesy-hours-production-parity

services:
  db:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: cheesy_frc_hours
      MYSQL_USER: cheesy_hours
      MYSQL_PASSWORD: "254254254"
      MYSQL_ROOT_PASSWORD: "254254254"
      TZ: UTC
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--user=root", "--password=254254254", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mysql84_data:/var/lib/mysql

  app:
    platform: linux/amd64
    build: .
    environment:
      DB_PASSWORD: "254254254"
      DISABLE_AUTH: "1"
      TEAM254_ENV: dev
      TZ: UTC
    entrypoint:
      - ruby
      - -rjson
      - -e
      - |
        config = {
          "global" => {
            "automatic_signout_offset_hours" => -2,
            "db_database" => "cheesy_frc_hours",
            "db_host" => "db",
            "db_user" => "cheesy_hours",
            "port" => 9006,
            "program" => "FRC"
          },
          "dev" => {
            "db_password" => ENV.fetch("DB_PASSWORD"),
            "members_url" => "http://127.0.0.1",
            "signin_ip_whitelist" => []
          }
        }
        File.write("/app/config.json", JSON.generate(config))
        abort "Database migration failed." unless system("bundle", "exec", "rake", "db:migrate")
        exec(*ARGV)
      - --
    command:
      - bundle
      - exec
      - ruby
      - hours_server_control.rb
      - run
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:9006/')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "127.0.0.1:9006:9006"

volumes:
  mysql84_data:
